name: Build Alpha VPN APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download libv2ray.aar (xray-core)
        run: |
          mkdir -p app/libs
          curl -L "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.30/libv2ray.aar" \
            -o app/libs/libv2ray.aar
          echo "libv2ray.aar: $(du -sh app/libs/libv2ray.aar | cut -f1)"

      - name: Download hev-socks5-tunnel.aar
        run: |
          curl -L "https://github.com/heiher/hev-socks5-tunnel/releases/download/2.18.0/hev-socks5-tunnel.aar" \
            -o app/libs/hev-socks5-tunnel.aar
          echo "hev-socks5-tunnel.aar: $(du -sh app/libs/hev-socks5-tunnel.aar | cut -f1)"

      - name: Download geo data files
        run: |
          mkdir -p app/src/main/assets
          curl -L "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat" \
            -o app/src/main/assets/geoip.dat
          curl -L "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat" \
            -o app/src/main/assets/geosite.dat
          echo "geoip: $(du -sh app/src/main/assets/geoip.dat | cut -f1)"
          echo "geosite: $(du -sh app/src/main/assets/geosite.dat | cut -f1)"

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Setup Gradle wrapper
        run: |
          chmod +x gradlew

      - name: Build Debug APK (all ABIs)
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: alpha-vpn-arm64-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*arm64*.apk
          retention-days: 30

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: alpha-vpn-armv7-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*armeabi*.apk
          retention-days: 30

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: alpha-vpn-universal-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*universal*.apk
          retention-days: 30
